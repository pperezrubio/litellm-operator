stages:
  - build

variables:
  DOCKERFILE: Dockerfile
  KANIKO_VERSION: "v1.23.2"

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:${KANIKO_VERSION}-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<JSONEOF
      {
        "auths": {
          "$FORGEJO_REGISTRY_URL": {
            "username": "$FORGEJO_REGISTRY_USER",
            "password": "$FORGEJO_REGISTRY_PASS"
          }
        }
      }
      JSONEOF
    - echo "$FORGEJO_REGISTRY_CA" >> /kaniko/ssl/certs/ca-certificates.crt
  script:
    - |
      /kaniko/executor \
        --dockerfile=${DOCKERFILE} \
        --context=${CI_PROJECT_DIR} \
        --build-arg=TARGETOS=linux \
        --build-arg=TARGETARCH=amd64 \
        --destination=$FORGEJO_REGISTRY_URL/pedro/homelab-images/litellm-operator:${CI_COMMIT_SHORT_SHA} \
        --destination=$FORGEJO_REGISTRY_URL/pedro/homelab-images/litellm-operator:latest \
        --cache=false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  tags:
    - kubernetes
